[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fwh-tess"
version = "0.1.0"
description = "An independent transit re-search of TESS 2-minute light curves, compared against SPOC's single-sector TCEs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",      # FITS reader + BoxLeastSquares
    "boto3>=1.28",       # anonymous reads of MAST's public S3 copy of TESS
    "scipy>=1.11",       # spline detrending
]

[project.optional-dependencies]
wotan = ["wotan>=1.10"]   # biweight detrending (pulls numba)
dev = ["pytest>=7.0", "ruff>=0.8.0", "wotan>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
